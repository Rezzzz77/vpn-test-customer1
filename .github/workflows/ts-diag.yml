name: ts-diag

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: diag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          {
            echo "time=$(date -u +%FT%TZ)"
            sudo modprobe tun 2>/dev/null || true
            sudo sysctl -w net.ipv4.ip_forward=1
            sudo sysctl -w net.ipv6.conf.all.forwarding=1
            curl -fsSL https://tailscale.com/install.sh | sh
            sudo systemctl stop tailscaled 2>/dev/null || true
            sudo mkdir -p /var/lib/tailscale
            sudo setsid nohup tailscaled --state=/var/lib/tailscale/ts.state --statedir=/var/lib/tailscale --socket=/var/lib/tailscale/ts-exit.sock > /tmp/tscaled.log 2>&1 &
            sleep 3
            sudo tailscale --socket=/var/lib/tailscale/ts-exit.sock up --authkey="${{ secrets.TS_AUTHKEY }}" --hostname=test-customer1 --advertise-exit-node --accept-dns=false --accept-risk=lose-ssh
            echo "UP_EXIT=$?"
            sudo tailscale --socket=/var/lib/tailscale/ts-exit.sock status
          } > diag.log 2>&1
          git config user.name ts-diag
          git config user.email ts-diag@users.noreply.github.com
          git add diag.log && git commit -m "diag log" || echo ok
          git push || true
          exit 0
