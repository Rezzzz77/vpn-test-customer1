name: ts-diag

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: diag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          {
            echo "time=$(date -u +%FT%TZ)"
            uname -a
            sudo modprobe tun 2>/dev/null
            if [ ! -c /dev/net/tun ]; then sudo mkdir -p /dev/net && sudo mknod /dev/net/tun c 10 200; fi
            ls -l /dev/net/tun
            curl -fsSL https://tailscale.com/install.sh | sh
            tailscale version
            sudo mkdir -p /var/run/tailscale /var/lib/tailscale
            sudo setsid nohup tailscaled --state=/var/lib/tailscale/ts.state --statedir=/var/lib/tailscale --socket=/var/run/tailscale/tailscaled.sock > /tmp/tscaled.log 2>&1 &
            sleep 5
            ps aux | grep tailscaled | grep -v grep
            HN="diag-ts"
            sudo tailscale --socket=/var/run/tailscale/tailscaled.sock up --authkey="${{ secrets.TS_AUTHKEY }}" --hostname="$HN" --advertise-exit-node --accept-dns=false --accept-risk=lose-ssh
            echo "UP_EXIT=$?"
            sudo tailscale --socket=/var/run/tailscale/tailscaled.sock status
            echo "tailscaled log:"
            cat /tmp/tscaled.log
          } > diag.log 2>&1
          git config user.name ts-diag
          git config user.email ts-diag@users.noreply.github.com
          git add diag.log
          git commit -m "diag log $(date -u +%FT%TZ)" || echo "nothing to commit"
          git push -q || echo "(push failed)"
          exit 0
